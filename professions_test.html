<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080708">
  <title>Профессии — Nightmare Spire</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17191a;
      --surface: #202324;
      --line: #383b3b;
      --text: #edeae2;
      --muted: #aaa9a2;
      --quiet: #898b87;
      --accent: #c4b498;
      --safe-top: max(16px, env(safe-area-inset-top));
      --safe-bottom: max(28px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      min-width: 280px;
      min-height: 100dvh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button { font: inherit; }

    button:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app {
      width: min(100%, 640px);
      min-height: 100dvh;
      margin-inline: auto;
      padding-bottom: var(--safe-bottom);
    }

    .masthead {
      display: flex;
      padding: var(--safe-top) 20px 18px;
      border-bottom: 1px solid var(--line);
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .masthead__eyebrow {
      margin: 0 0 4px;
      color: var(--quiet);
      font-size: .73rem;
      font-weight: 500;
      letter-spacing: .02em;
    }

    .masthead h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 6vw, 2.15rem);
      font-weight: 400;
      letter-spacing: -.02em;
      line-height: 1.1;
    }

    .masthead__total {
      max-width: 14ch;
      margin: 0 0 2px;
      color: var(--quiet);
      font-size: .74rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .profession-nav {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      padding: 0 12px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      overscroll-behavior-x: contain;
    }

    .profession-tab {
      flex: 0 0 auto;
      min-height: 52px;
      padding: 12px 14px 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--quiet);
      cursor: pointer;
      transition: color 160ms ease, border-color 160ms ease;
    }

    .profession-tab:hover { color: var(--text); }
    .profession-tab:active { transform: translateY(1px); }
    .profession-tab[aria-selected="true"] {
      border-bottom-color: var(--accent);
      color: var(--text);
    }
    .profession-tab__name {
      font-size: .86rem;
      font-weight: 550;
      white-space: nowrap;
    }

    .profession-view { padding: 22px 20px 38px; }

    .profession-hero {
      padding: 0 0 26px;
      border-bottom: 1px solid var(--line);
    }

    .profession-identity__meta {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 550;
      font-variant-numeric: tabular-nums;
    }

    .profession-identity h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 2.75rem);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .progress { margin-top: 22px; }
    .progress__numbers {
      display: flex;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .8rem;
      font-variant-numeric: tabular-nums;
      justify-content: space-between;
      gap: 12px;
    }
    .progress__numbers strong {
      color: var(--text);
      font-weight: 550;
    }
    .progress__track {
      height: 3px;
      overflow: hidden;
      background: var(--line);
    }
    .progress__fill {
      height: 100%;
      background: var(--accent);
    }

    .summary {
      margin: 8px 0 22px;
      border-bottom: 1px solid var(--line);
    }
    .summary-row {
      display: grid;
      grid-template-columns: minmax(120px, .75fr) minmax(0, 1.25fr);
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      align-items: baseline;
      gap: 16px;
    }
    .summary-row:last-child { border-bottom: 0; }
    .summary-row__label {
      color: var(--quiet);
      font-size: .83rem;
    }
    .summary-row__value {
      color: var(--text);
      font-size: .86rem;
      font-weight: 550;
      text-align: right;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }
    .summary-row__value--rare { color: var(--accent); }

    .section { border-bottom: 1px solid var(--line); }
    .section > summary {
      display: grid;
      min-height: 62px;
      padding: 15px 0;
      cursor: pointer;
      list-style: none;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
    }
    .section > summary::-webkit-details-marker { display: none; }
    .section__title {
      display: block;
      font-size: .95rem;
      font-weight: 550;
    }
    .section__summary {
      display: block;
      margin-top: 2px;
      color: var(--quiet);
      font-size: .76rem;
    }
    .section__toggle {
      color: var(--quiet);
      font-size: 1.2rem;
      font-weight: 300;
      line-height: 1;
    }
    .section[open] .section__toggle { transform: rotate(45deg); }
    .section__body { padding: 2px 0 18px; }

    .material-list { display: grid; }
    .material {
      display: grid;
      min-height: 54px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }
    .material__name {
      display: block;
      font-size: .88rem;
      font-weight: 550;
    }
    .material__note {
      display: block;
      color: var(--quiet);
      font-size: .74rem;
    }
    .material__state {
      color: var(--accent);
      font-size: .76rem;
      text-align: right;
      white-space: nowrap;
    }
    .material--locked .material__name,
    .material--locked .material__state { color: var(--quiet); }

    .profession-note {
      max-width: 60ch;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.65;
      text-wrap: pretty;
    }

    .state {
      display: grid;
      min-height: 50dvh;
      padding: 40px 24px;
      place-content: center;
    }
    .state__sign { display: none; }
    .state h2 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.55rem;
      font-weight: 400;
    }
    .state p {
      max-width: 38ch;
      margin: 0;
      color: var(--muted);
      font-size: .88rem;
    }

    @media (max-width: 360px) {
      .masthead { padding-inline: 16px; }
      .profession-view { padding-inline: 16px; }
      .summary-row { grid-template-columns: 1fr; gap: 2px; }
      .summary-row__value { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .profession-tab { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div>
        <p class="masthead__eyebrow">Nightmare Spire</p>
        <h1>Профессии</h1>
      </div>
      <p class="masthead__total" id="profession-total">Ремесленные архивы</p>
    </header>
    <div id="app-content" aria-live="polite">
      <section class="state">
        <div class="state__sign">◇</div>
        <h2>Открываем архивы</h2>
        <p>Загружаем сведения о профессиях героя.</p>
      </section>
    </div>
  </main>

  <script>
    const telegram = window.Telegram && window.Telegram.WebApp;
    if (telegram) {
      telegram.ready();
      telegram.expand();
    }

    const escapeHtml = (value) =>
      String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    const formatNumber = (value) =>
      Number(value || 0).toLocaleString("ru-RU");
    const plural = (number, one, few, many) => {
      const lastTwo = number % 100;
      if (lastTwo >= 11 && lastTwo <= 14) return many;
      const last = number % 10;
      return last === 1 ? one : last >= 2 && last <= 4 ? few : many;
    };

    const PROFESSION_META = {
      mining: { short: "Горняк" },
      smithing: { short: "Кузнец" },
      armorsmithing: { short: "Бронник" },
      alchemy: { short: "Алхимик" },
      jeweling: { short: "Ювелир" },
      jewelcrafting: { short: "Ювелир" },
      weaving: { short: "Ткач" }
    };

    // Точные рецепты и бонусы остаются в игровых меню: URL передаёт только
    // уровень, опыт и для горняка список доступных по уровню материалов.
    function normalizedProfession(raw) {
      const safeNumber = (value) => {
        const number = Number(value);
        return Number.isFinite(number) ? Math.max(0, Math.floor(number)) : 0;
      };
      return {
        code: String(raw && raw.c || "unknown"),
        name: String(raw && raw.n || "Неизвестная профессия"),
        level: safeNumber(raw && raw.l),
        experience: safeNumber(raw && raw.e),
        experienceNext: safeNumber(raw && raw.x),
        mining: raw && raw.m && typeof raw.m === "object" && !Array.isArray(raw.m) ? raw.m : {}
      };
    }

    function section(title, summary, body, open = false) {
      return `<details class="section"${open ? " open" : ""}>
        <summary>
          <span><span class="section__title">${title}</span><span class="section__summary">${summary}</span></span>
          <span class="section__toggle" aria-hidden="true">+</span>
        </summary>
        <div class="section__body">${body}</div>
      </details>`;
    }

    function materials(available, locked) {
      const ready = (Array.isArray(available) ? available : []).map((name) =>
        `<div class="material"><span><span class="material__name">${escapeHtml(name)}</span><span class="material__note">Открыто по уровню профессии</span></span>
        <span class="material__state">Доступно</span></div>`
      );
      const closed = (Array.isArray(locked) ? locked : []).filter(Array.isArray).map(([name, level]) =>
        `<div class="material material--locked"><span><span class="material__name">${escapeHtml(name)}</span><span class="material__note">Пока закрыто по уровню</span></span>
        <span class="material__state">${escapeHtml(level)} ур.</span></div>`
      );
      return `<div class="material-list">${ready.concat(closed).join("")}</div>`;
    }

    const PROFESSION_COPY = {
      smithing: {
        role: "Оружие",
        access: "Изученные чертежи",
        detail: "Кузнец создаёт физическую основу оружия. Форму и металл задаёт изученный чертёж; результат зависит от освоения металла. Дальнейшую работу с чистой заготовкой выполняет Ткач."
      },
      armorsmithing: {
        role: "Броня",
        access: "Изученные чертежи",
        detail: "Бронник создаёт физическую основу брони по изученному чертежу. Освоение выбранного металла влияет на качество основы; чистую заготовку можно передать Ткачу."
      },
      alchemy: {
        role: "Алхимические составы",
        access: "Изученные рецепты",
        detail: "Алхимик готовит составы по изученным рецептам. Доступные эффекты, ингредиенты и требования смотрите в лаборатории перед началом варки."
      },
      jewelcrafting: {
        role: "Оправы и камни",
        access: "Изученные чертежи",
        detail: "Ювелир создаёт чистые оправы по чертежам. Бонусы появляются после работы с камнями и инкрустации, а не при изготовлении пустой оправы."
      },
      jeweling: {
        role: "Оправы и камни",
        access: "Изученные чертежи",
        detail: "Ювелир создаёт чистые оправы по чертежам. Бонусы появляются после работы с камнями и инкрустации, а не при изготовлении пустой оправы."
      },
      weaving: {
        role: "Плетение снаряжения",
        access: "Изученные узоры",
        detail: "Ткач работает с чистыми заготовками оружия и брони. Доступные узоры и стоимость плетения зависят от конкретного предмета; проверьте их в игровом меню."
      }
    };

    function professionSummary(profession) {
      if (profession.code === "mining") {
        const mining = profession.mining;
        return [
          ["Руд по уровню", String(Array.isArray(mining.am) ? mining.am.length : 0)],
          ["Самоцветов по уровню", String(Array.isArray(mining.ag) ? mining.ag.length : 0)],
          ["Улучшение шахты", escapeHtml(mining.lb || "Без улучшений")]
        ];
      }
      const copy = PROFESSION_COPY[profession.code];
      return copy ? [["Ремесло", copy.role], ["Доступ", copy.access]] : [];
    }

    function professionDetails(profession) {
      if (profession.code === "mining") {
        const mining = profession.mining;
        const availableOre = Array.isArray(mining.am) ? mining.am : [];
        const availableGems = Array.isArray(mining.ag) ? mining.ag : [];
        return [
          section("Руды", `${availableOre.length} открыто по уровню`,
            materials(availableOre, mining.lm), true),
          section("Самоцветы", `${availableGems.length} открыто по уровню`,
            materials(availableGems, mining.lg)),
          `<p class="profession-note">Списки показывают доступ по уровню горняка, а не гарантированную добычу. Фактический результат зависит от шахты и текущих игровых условий.</p>`
        ].join("");
      }
      const copy = PROFESSION_COPY[profession.code];
      const detail = copy ? copy.detail : "Уровень и опыт переданы игрой. За подробностями откройте меню этой профессии в боте.";
      return section("Как работает", "Актуальный порядок ремесла", `<p class="profession-note">${detail}</p>`, true) +
        `<p class="profession-note">Точные рецепты, цены и шансы смотрите в игровом меню: эта страница не получает их вместе с данными персонажа.</p>`;
    }

    function hero(profession) {
      const maximum = profession.experienceNext;
      const percent = maximum > 0 ? Math.min(100, profession.experience / maximum * 100) : 0;
      const remaining = Math.max(0, maximum - profession.experience);
      return `<section class="profession-hero">
        <div class="profession-identity">
          <p class="profession-identity__meta">Уровень ${profession.level}</p>
          <h2>${escapeHtml(profession.name)}</h2>
        </div>
        <div class="progress">
          <div class="progress__numbers"><strong>${formatNumber(profession.experience)} опыта</strong><span>до уровня: ${formatNumber(remaining)}</span></div>
          <div class="progress__track" aria-label="Прогресс опыта ${Math.round(percent)}%">
            <div class="progress__fill" style="width:${percent}%"></div>
          </div>
        </div>
      </section>`;
    }

    function renderView(profession) {
      const rows = professionSummary(profession);
      return `<article class="profession-view" id="profession-panel" role="tabpanel">
        ${hero(profession)}
        ${rows.length ? `<div class="summary">${rows.map(([label, value], index) =>
          `<div class="summary-row"><span class="summary-row__label">${label}</span><span class="summary-row__value${index === 2 ? " summary-row__value--rare" : ""}">${value}</span></div>`
        ).join("")}</div>` : ""}
        ${professionDetails(profession)}
      </article>`;
    }

    function renderApplication(professions) {
      const content = document.querySelector("#app-content");
      const total = professions.reduce((sum, profession) => sum + profession.level, 0);
      document.querySelector("#profession-total").textContent =
        `${professions.length} ${plural(professions.length, "профессия", "профессии", "профессий")} · ` +
        `${total} ${plural(total, "уровень", "уровня", "уровней")}`;

      content.innerHTML = `<nav class="profession-nav" role="tablist" aria-label="Профессии">
        ${professions.map((profession, index) => {
          const meta = PROFESSION_META[profession.code] || { short: profession.name };
          return `<button class="profession-tab" role="tab" data-index="${index}" aria-selected="${index === 0}">
            <span class="profession-tab__name">${escapeHtml(meta.short)}</span>
          </button>`;
        }).join("")}
      </nav><div id="profession-stage">${renderView(professions[0])}</div>`;

      const tabs = [...content.querySelectorAll(".profession-tab")];
      const activate = (index, focus = false) => {
        tabs.forEach((tab, tabIndex) => {
          tab.setAttribute("aria-selected", String(tabIndex === index));
          tab.tabIndex = tabIndex === index ? 0 : -1;
        });
        document.querySelector("#profession-stage").innerHTML = renderView(professions[index]);
        tabs[index].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        if (focus) tabs[index].focus();
      };

      tabs.forEach((tab, index) => {
        tab.tabIndex = index === 0 ? 0 : -1;
        tab.addEventListener("click", () => activate(index));
        tab.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const next =
            event.key === "Home" ? 0 :
            event.key === "End" ? tabs.length - 1 :
            event.key === "ArrowRight" ? (index + 1) % tabs.length :
            (index - 1 + tabs.length) % tabs.length;
          activate(next, true);
        });
      });
    }

    function renderState(title, message, sign = "◇") {
      document.querySelector("#app-content").innerHTML =
        `<section class="state"><div class="state__sign">${sign}</div><h2>${title}</h2><p>${message}</p></section>`;
    }

    try {
      const raw = new URLSearchParams(location.search).get("data");
      if (!raw) {
        renderState("Профессии ещё не освоены", "Освойте первое ремесло в игре, и сведения появятся в этом архиве.");
      } else {
        let parsed;
        try {
          parsed = JSON.parse(raw);
        } catch {
          parsed = JSON.parse(decodeURIComponent(raw));
        }
        if (!Array.isArray(parsed) || parsed.length === 0) {
          renderState("Профессии ещё не освоены", "Освойте первое ремесло в игре, и сведения появятся в этом архиве.");
        } else {
          renderApplication(parsed.map(normalizedProfession));
        }
      }
    } catch (error) {
      console.error("Professions data error", error);
      renderState("Не удалось открыть архив", "Данные профессий повреждены или устарели. Вернитесь в игру и откройте раздел повторно.", "!");
    }
  </script>
</body>
</html>
